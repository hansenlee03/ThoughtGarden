<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#121827" />
  <meta name="description" content="Thought Garden turns private reflections into a living, animated garden in your browser." />
  <title>Thought Garden</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">A private little place to think</p>
        <h1>Thought Garden</h1>
      </div>
      <details class="menu">
        <summary aria-label="Garden menu">⋯</summary>
        <div class="menu-panel">
          <button id="export-button" type="button">Export garden</button>
          <button id="import-button" type="button">Import garden</button>
          <button id="clear-button" type="button" class="danger">Clear garden</button>
        </div>
      </details>
    </header>

    <section id="garden-canvas" aria-label="Your thought garden">
      <div id="plant-accessibility-layer" aria-label="Saved thoughts"></div>
      <div id="tooltip" class="tooltip" role="status" hidden></div>
    </section>

    <section class="composer-shell" aria-label="Plant a thought">
      <div class="tagline">Your thoughts do not disappear. They grow.</div>
      <form id="thought-form" novalidate>
        <label for="thought-input">What is on your mind?</label>
        <textarea id="thought-input" rows="3" maxlength="500" placeholder="Write a thought, an idea, a small moment..." required></textarea>
        <div class="composer-meta">
          <span id="input-error" class="input-error" role="alert"></span>
          <span id="char-count" aria-live="polite">0 / 500</span>
        </div>
        <button id="plant-button" type="submit">Plant it</button>
      </form>
      <p id="privacy-note">Your thoughts are analyzed and stored only in this browser. Nothing is sent to a server.</p>
    </section>

    <div id="notice-region" class="notice" aria-live="polite" hidden></div>
    <div id="p5-error" class="notice error" hidden>
      The garden renderer could not load. Please check your connection and refresh.
    </div>

    <dialog id="thought-dialog">
      <article>
        <button id="dialog-close" class="dialog-close" type="button" aria-label="Close thought">×</button>
        <p id="dialog-date" class="dialog-date"></p>
        <p id="dialog-text" class="dialog-text"></p>
      </article>
    </dialog>

    <input id="import-file" type="file" accept=".json,application/json" hidden />
    <noscript>This app needs JavaScript to grow your garden.</noscript>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
